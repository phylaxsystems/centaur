# Kept as a read-only chart check while existing required-check names migrate.
# The bundle publisher is the sole writer; no Pages branch or GitHub releases.
name: Release Chart

on:
  pull_request:
    paths: ["contrib/chart/**", "scripts/release.py", "scripts/test_release.py", ".github/workflows/release-chart.yml"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.1
      - run: |
          python3 -m pip install PyYAML==6.0.3
          helm repo add onepassword https://1password.github.io/connect-helm-charts
          python3 -m unittest discover -s scripts -p test_release.py -v
