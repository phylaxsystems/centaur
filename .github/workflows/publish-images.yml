name: Publish Centaur bundle

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      accepted_rc:
        description: Accepted RC tag (required if several RC tags share the stable commit)
        type: string
        required: false

permissions:
  contents: read

# One writer for every immutable package, including reruns and tag promotions.
concurrency:
  group: centaur-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.1
      - run: |
          python3 -m pip install PyYAML==6.0.3
          helm repo add onepassword https://1password.github.io/connect-helm-charts
          python3 -m unittest discover -s scripts -p test_release.py -v

  publish:
    needs: validate
    # PRs never log into GHCR or push. A human enables publication separately
    # after package permissions and the protected environment are configured.
    if: >-
      github.repository == 'phylaxsystems/centaur' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      vars.CENTAUR_PUBLISH_ENABLED == 'true' && vars.CENTAUR_BUILD_RUNNER != ''
    runs-on: ${{ vars.CENTAUR_BUILD_RUNNER }}
    timeout-minutes: 180
    environment: centaur-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.1
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install release tools and authenticate Helm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m pip install PyYAML==6.0.3
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          helm repo add onepassword https://1password.github.io/connect-helm-charts
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish immutable images and private OCI charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CENTAUR_PUBLISH_ENABLED: "true"
          ACCEPTED_RC: ${{ inputs.accepted_rc }}
        run: |
          python3 scripts/release.py publish --ref "$GITHUB_REF" --commit "$GITHUB_SHA" --accepted-rc "$ACCEPTED_RC"
          # The receipt contains coordinates and digests, not credentials or
          # chart contents. No package archives are uploaded to public Actions.
          cat dist/release/release.json >> "$GITHUB_STEP_SUMMARY"
